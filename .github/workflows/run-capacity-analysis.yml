name: Run Capacity Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/**"
      - "data/**"

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas matplotlib

      - name: Run capacity analysis
        run: python analysis/capacity_analysis.py

      - name: Upload demand scenario chart
        uses: actions/upload-artifact@v4
        with:
          name: demand-scenarios-chart
          path: outputs/demand_scenarios.png
